services:
  - type: web
    name: am-trading-platform
    runtime: node
    plan: starter
    region: ohio
    rootDir: .
    # npm test removed from this command (2026-09-14, incident fix — the
    # workspace ran out of Render's own metered build-pipeline minutes,
    # confirmed via a "Build canceled: your workspace has run out of
    # build pipeline minutes" event). Running the full 160-file suite
    # inside Render's own build pipeline on every single push was real,
    # avoidable usage separate from the actual npm run build step. Tests
    # now run in .github/workflows/test.yml (GitHub Actions, free for
    # this pattern) on every push/PR to main instead — real coverage,
    # just off Render's billed pipeline.
    # IMPORTANT — real behavior change: this does NOT gate deploys on
    # test results anymore. Render has no configured dependency on the
    # GitHub Actions run, so a commit whose tests would fail can still
    # build and deploy here; GitHub Actions only reports pass/fail after
    # the fact (visible on the commit/PR), it does not block Render.
    # Previously, a real test failure hard-blocked every deploy (see this
    # exact incident's root cause) — that automatic "never ship a
    # red-test commit" property no longer exists. Treat GitHub Actions'
    # own status as something to check before/after pushing, not as an
    # enforced gate.
    buildCommand: "npm install --include=dev --no-audit --no-fund && npm run build"
    startCommand: "npm start"
    healthCheckPath: /api/health
    autoDeploy: true
    # The dealer-data disk is intentionally NOT declared here. Blueprint sync
    # never actually provisioned it (showed "attached" but was 0 bytes/not
    # attached) — it had to be added manually in the dashboard instead. With
    # it declared here too, every git-push-triggered Blueprint sync appeared
    # to fight with the manually-managed disk and reset it before the next
    # boot, wiping dealer data on every routine deploy. Manage the disk only
    # through the dashboard from now on: Settings -> Disks, name
    # "dealer-data", mount path /opt/render/project/src/data, size 1GB.
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: UNUSUAL_WHALES_API_KEY
        sync: false
      - key: TRADIER_API_KEY
        sync: false
      - key: RENTCAST_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TV_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ASTRA_ENABLED
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ALPACA_KEY_ID
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: AUTODEV_API_KEY
        sync: false
      - key: MARKETCHECK_API_KEY
        sync: false
      - key: SERVER_AUTOPILOT
        sync: false
      - key: MEANREV_PAPER
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_AUTO_SEND
        sync: false
      - key: DEALER_NAME
        sync: false
      - key: DEALER_ADDR
        sync: false
      - key: DEALER_PHONE
        sync: false
