name: Test

# Moved off Render's own build pipeline (2026-09-14) — that pipeline is a
# metered resource (real build-pipeline minutes, billed per workspace),
# and the full test suite (160 files) running there on every single push
# was a real, avoidable driver of usage, separate from the actual
# npm run build step. GitHub Actions is free for this use pattern. This
# does NOT gate Render deploys (Render isn't configured to wait on an
# external CI status check) — it's visibility/regression-catching, not a
# deploy blocker. See render.yaml's own comment for the other half of
# this change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm test
